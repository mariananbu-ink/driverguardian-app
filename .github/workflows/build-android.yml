# DriverGuardian — build the Android APK / AAB and the iPhone web app (PWA) on GitHub Actions.
# Repository → Settings → Secrets and variables → Actions:
#   Variables:  API_BASE                    e.g. https://driverguardian.in   (your Laravel site, no trailing slash;
#                                           if not set, the app uses https://driverguardian.in)
#   Secrets (all optional):
#     GOOGLE_SERVICES_JSON                 contents of Firebase google-services.json (push notifications)
#     ANDROID_KEYSTORE_BASE64              base64 of upload-keystore.jks (Play Store signing)
#     ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Run: Actions → Build Android → Run workflow   (or push a tag like v2.10.0 to also publish a GitHub Release)
# Two jobs run side by side: “android” (APK + AAB) and “web” (PWA zip) — if one fails, the other's artifact is still there.
# Outputs: DriverGuardian-x.y.z.apk / .aab (artifact DriverGuardian-android) and DriverGuardian-pwa-x.y.z.zip
#          (artifact DriverGuardian-pwa → install it on the server: System → Apps).
# Developed & Powered by Marian Anbu Juwan
name: Build Android

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'What to build (fewer = fewer GitHub minutes)'
        type: choice
        default: 'Play Store AAB + APK + web app'
        options:
          - 'Play Store AAB + APK + web app'
          - 'Play Store AAB only'
          - 'APK only'
          - 'Web app (PWA) only'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Android and the web app build on two separate machines at the same time: faster, and a problem in one
  # never loses the other's result.
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.build != 'Web app (PWA) only'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      API_BASE: ${{ vars.API_BASE || 'https://driverguardian.in' }}
      WHAT: ${{ inputs.build || 'Play Store AAB + APK + web app' }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          echo "App will connect to: $API_BASE"
          case "$API_BASE" in */) echo "::error::API_BASE must not end with / — use e.g. https://driverguardian.in"; exit 1;; esac
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::No upload key secrets — the AAB is signed with a debug key and Google Play will REJECT it. Add the four ANDROID_KEY… secrets (see PLAY-STORE-GUIDE)."; fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && { [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; }; then echo "::error::ANDROID_KEYSTORE_BASE64 is set but a password / alias secret is missing."; exit 1; fi
          if [ -f pubspec.yaml ]; then echo "pubspec.yaml found"; else echo "::error::pubspec.yaml is not at the repository root — upload the CONTENTS of the mobile/ folder, not the folder itself."; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: |
          # web/ ships with the app (index.html, icons, dg-pwa.js …) — flutter create keeps existing files
          flutter create --org in.marianstudio --project-name driverguardian --platforms android,ios,web .
          rm -rf test

      - name: Firebase config (optional)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Upload key (optional)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/upload-keystore.jks
          # check the key opens with the given password and alias before spending minutes on the build
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null \
            || { echo "::error::The upload key could not be opened — check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (alias is usually: upload)."; exit 1; }
          echo "Upload key OK"

      - name: Android SDK platform 37
        # newer AndroidX libraries need compileSdk 37; Gradle can also fetch it itself
        run: |
          SM=$(ls $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || command -v sdkmanager || true)
          if [ -n "$SM" ]; then yes | "$SM" --install "platforms;android-37" >/dev/null || echo "::warning::platform 37 not pre-installed — Gradle will download it"; fi

      - name: Patch Android / iOS settings
        run: python3 tool/patch_platforms.py

      - name: Dependencies, icons & splash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build number
        # always increases, so every build can be uploaded to the Play Store
        run: echo "BUILD_NO=$(( $(date +%s) / 60 ))" >> $GITHUB_ENV

      - name: Build APK
        if: env.WHAT != 'Play Store AAB only'
        run: flutter build apk --release --build-number=$BUILD_NO --dart-define=API_BASE=$API_BASE

      - name: Build App Bundle (Play Store)
        if: env.WHAT != 'APK only'
        run: flutter build appbundle --release --build-number=$BUILD_NO --dart-define=API_BASE=$API_BASE

      - name: Rename outputs
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p out
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then cp build/app/outputs/flutter-apk/app-release.apk out/DriverGuardian-$V.apk; fi
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then cp build/app/outputs/bundle/release/app-release.aab out/DriverGuardian-$V.aab; fi
          if [ -f android/app/upload-keystore.jks ]; then KEY="your upload key"; else KEY="DEBUG key (not for Play Store)"; fi
          echo "Version $V · build number $BUILD_NO · server $API_BASE · signed with $KEY" | tee out/BUILD-INFO.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DriverGuardian-android
          path: out/*

  web:
    if: github.event_name != 'workflow_dispatch' || inputs.build == 'Play Store AAB + APK + web app' || inputs.build == 'Web app (PWA) only'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the web platform folder
        run: |
          # web/ ships with the app (index.html, icons, dg-pwa.js …) — flutter create keeps existing files
          flutter create --org in.marianstudio --project-name driverguardian --platforms web .
          rm -rf test
          flutter pub get

      - name: Build web app (iPhone & Android PWA)
        # no API_BASE needed: the web app talks to the site it is served from (<site>/app/ → <site>)
        # --no-web-resources-cdn: the rendering engine is served from your own site, not gstatic.com
        # --no-wasm-dry-run: skip the optional WebAssembly test compile (saves time and memory on the runner)
        run: |
          BUILD_NO=$(( $(date +%s) / 60 ))
          flutter build web --release --build-number=$BUILD_NO --no-web-resources-cdn --no-wasm-dry-run
          grep -q 'dg-pwa.js' build/web/index.html || { echo "::error::web/index.html was replaced — upload the web/ folder from the zip"; exit 1; }
          test -f build/web/dg-sw.js

      - name: Zip the web app
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p pwa
          (cd build/web && zip -qr ../../pwa/DriverGuardian-pwa-$V.zip .)
          ls -la pwa

      - uses: actions/upload-artifact@v4
        with:
          name: DriverGuardian-pwa
          path: pwa/*

  release:
    # tags only (v2.10.0 …): attach the APK, AAB and PWA zip to a GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DriverGuardian-android/*
            dist/DriverGuardian-pwa/*
