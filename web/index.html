<!DOCTYPE html>
<html lang="en">
<head>
  <!-- DriverGuardian web app (PWA) — the same Flutter app as Android, served from <your-site>/app/.
       No <base> tag on purpose: everything loads relative to this page, so it works on any domain or sub-folder.
       Developed & Powered by Marian Anbu Juwan -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="DriverGuardian — live school bus tracking, attendance, fees and alerts for parents, drivers and schools.">
  <meta name="theme-color" content="#0B1033">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DriverGuardian">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>DriverGuardian</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B1033; overscroll-behavior: none; }
    #dg-splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 80% at 50% 0%, #1B2366 0%, #0B1033 62%); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; transition: opacity .4s ease; }
    #dg-splash.gone { opacity: 0; pointer-events: none; }
    #dg-splash .ring { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    #dg-splash .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(122,162,255,.35); animation: dgPulse 2.2s ease-out infinite; }
    #dg-splash .ring::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 2px solid transparent; border-top-color: #7AA2FF; animation: dgSpin 1.4s linear infinite; }
    #dg-splash img { width: 104px; height: 104px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
    #dg-splash h1 { margin: 26px 0 4px; font-weight: 300; font-size: 26px; letter-spacing: .5px; }
    #dg-splash h1 b { font-weight: 700; }
    #dg-splash p { margin: 0; font-size: 13px; font-weight: 300; color: rgba(255,255,255,.65); letter-spacing: .3px; }
    #dg-splash .msg { margin-top: 22px; min-height: 18px; font-size: 12.5px; color: #FCD34D; text-align: center; padding: 0 24px; }
    #dg-splash .msg a { color: #fff; }
    #dg-splash .credit { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); font-size: 10.5px; color: rgba(255,255,255,.4); font-weight: 300; }
    @keyframes dgSpin { to { transform: rotate(360deg); } }
    @keyframes dgPulse { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
  </style>
  <script src="dg-pwa.js"></script>
</head>
<body>
  <div id="dg-splash" role="status" aria-label="Loading DriverGuardian">
    <div class="ring"><img src="icons/splash-mark.png" alt=""></div>
    <h1>Driver<b>Guardian</b></h1>
    <p>School bus tracking &amp; safety</p>
    <div class="msg" id="dg-splash-msg"></div>
    <div class="credit">Developed &amp; Powered by Marian Anbu Juwan</div>
  </div>
  <noscript><p style="color:#fff;text-align:center;font-family:sans-serif;padding:40px">Please enable JavaScript to use DriverGuardian.</p></noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
