name: driverguardian
description: "DriverGuardian — School Bus Management mobile app (parents, drivers, school admins). Developed & Powered by Marian Anbu Juwan"
publish_to: 'none'
version: 2.12.0+33

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  wakelock_plus: ^1.3.2
  google_fonts: ^6.2.1
  mobile_scanner: ^7.0.1
  video_player: ^2.9.5
  image_picker: ^1.1.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  permission_handler: '>=12.0.0 <14.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/logo.png
    - assets/icon/marker.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  remove_alpha_ios: true

# native splash (shown while the app starts) — same navy + seal as the animated splash
flutter_native_splash:
  color: "#0B1033"
  image: assets/icon/splash.png
  android_12:
    image: assets/icon/splash12.png
    color: "#0B1033"
    icon_background_color: "#0B1033"
  ios: true
  android: true
  web: false
